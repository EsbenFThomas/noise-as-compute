<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<title>Two oscillators and a matrix inverse</title>
<style>
:root {
  color-scheme: light dark;
  --background: light-dark(rgb(255 255 255), rgb(24 24 24));
  --foreground: light-dark(rgb(26 28 31), rgb(255 255 255));
  --muted-foreground: light-dark(rgb(26 28 31 / 49.4%), rgb(255 255 255 / 49.8%));
  --border: light-dark(rgb(26 28 31 / 8%), rgb(255 255 255 / 8.2%));
  --primary: light-dark(rgb(51 156 255), rgb(131 195 255));
  --primary-foreground: light-dark(rgb(255 255 255), rgb(13 13 13));
  --secondary: light-dark(rgb(255 255 255 / 96%), rgb(54 54 54 / 96%));
  --ring: light-dark(rgb(51 156 255), rgb(131 195 255 / 76%));
  --viz-series-1: var(--primary);
  --viz-series-2: light-dark(rgb(243 136 59), rgb(245 154 86));
  --font-sans: ui-sans-serif, -apple-system, system-ui, "Segoe UI", Helvetica, Arial, sans-serif;
  --font-size-small: 14px;
}
* {box-sizing: border-box}
body {
  margin: 0;
  padding: 24px;
  color: var(--foreground);
  background: var(--background);
  font-family: var(--font-sans);
  font-size: 16px;
  line-height: 1.625;
  -webkit-font-smoothing: antialiased;
}
main {max-width: 760px; margin: 0 auto}
h1 {margin: 0; font-size: 18px; font-weight: 600; line-height: 1.55}
sub, sup {line-height: 0}
svg {display: block; max-width: 100%; height: auto}

.viz-row {display: flex; flex-wrap: wrap; align-items: center; gap: 10px}
.viz-grid {display: grid; grid-template-columns: repeat(auto-fit, minmax(max(180px, 24%), 1fr)); gap: 10px}
.viz-controls {display: flex; flex-wrap: wrap; align-items: center; gap: 8px}
.text-small {font-size: var(--font-size-small); line-height: calc(var(--font-size-small) + 4px)}
.text-muted {color: var(--muted-foreground)}
.tabular-nums {font-variant-numeric: tabular-nums}

.form-label {
  display: grid;
  min-width: min(100%, 260px);
  flex: 1 1 280px;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: baseline;
  gap: 2px 12px;
}
.form-range {
  grid-column: 1 / -1;
  appearance: none;
  display: block;
  width: 100%;
  height: 36px;
  margin: 0;
  padding: 0;
  border: 0;
  border-radius: 9999px;
  outline: none;
  color: var(--foreground);
  background: transparent;
  accent-color: var(--primary);
  font: inherit;
}
.form-range::-webkit-slider-runnable-track {height: 2px; border-radius: 9999px; background: var(--border)}
.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: -9px;
  border: 1px solid transparent;
  border-radius: 9999px;
  background: currentColor;
  box-shadow: 0 1px 2px -1px rgb(0 0 0 / 8%);
}
.form-range:focus-visible::-webkit-slider-runnable-track {outline: 2px auto Highlight; outline-color: -webkit-focus-ring-color}
.form-range::-moz-range-track {height: 2px; border-radius: 9999px; background: var(--border)}
.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid transparent;
  border-radius: 9999px;
  background: currentColor;
  box-shadow: 0 1px 2px -1px rgb(0 0 0 / 8%);
}
.form-range:focus-visible::-moz-range-thumb {outline: 2px solid Highlight; outline-offset: 2px}

.btn {
  appearance: button;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 36px;
  margin: 0;
  padding: 0 12px;
  border: 1px solid var(--border);
  border-radius: 9999px;
  color: var(--foreground);
  background: var(--secondary);
  font: inherit;
  font-size: 14px;
  line-height: 18px;
  white-space: nowrap;
  cursor: pointer;
  user-select: none;
}
.btn:hover {background: light-dark(color-mix(in srgb, var(--foreground) 5.5%, transparent), color-mix(in srgb, var(--foreground) 8%, transparent))}
.btn-primary {color: var(--primary-foreground); background: var(--foreground)}
.btn-primary:hover {background: color-mix(in srgb, var(--foreground) 80%, transparent)}
.btn:focus-visible {outline: none; box-shadow: 0 0 0 2px var(--ring)}

@media (pointer: coarse) {
  .btn {min-height: 44px}
  .form-range {height: 44px; touch-action: pan-y}
}
@media (max-width: 480px) {
  body {padding: 14px}
}
</style>
</head>
<body><main>
<div id="osc-inverse">
  <h1>Two oscillators and a matrix inverse</h1>
  <div class="viz-controls">
    <label class="form-label">Left spring k<sub>1</sub>: <output id="o-k1">1.0</output><input class="form-range" id="k1" type="range" min="0.5" max="3" step="0.1" value="1"></label>
    <label class="form-label">Right spring k<sub>2</sub>: <output id="o-k2">1.0</output><input class="form-range" id="k2" type="range" min="0.5" max="3" step="0.1" value="1"></label>
    <label class="form-label">Connecting spring k<sub>c</sub>: <output id="o-kc">1.0</output><input class="form-range" id="kc" type="range" min="0" max="3" step="0.1" value="1"></label>
  </div>
  <div class="viz-row"><button class="btn" id="pause" type="button">Pause</button><button class="btn btn-primary" id="collect" type="button">Collect 900 more time units</button><span class="text-small" id="status" aria-live="polite">Sampling</span></div>
  <svg id="mechanics" role="img" aria-label="Two noise-driven masses joined by a spring, with an outer spring on each side"></svg>
  <div class="viz-row text-small"><span>Independent noise · damping = 1 · mass = 1 · k<sub>B</sub>T = 1</span></div>
  <div class="viz-grid" id="matrices">
    <div><div>Spring matrix K</div><div class="matrix tabular-nums" id="km"></div></div>
    <div><div>Exact inverse K<sup>−1</sup></div><div class="matrix tabular-nums" id="im"></div></div>
    <div><div>Measured covariance</div><div class="matrix tabular-nums" id="cm"></div></div>
  </div>
  <div class="viz-row text-small tabular-nums"><span id="duration"></span><span id="error"></span></div>
  <svg id="cloud" role="img" aria-label="Scatter of displacement pairs, with the theoretical 95 percent probability ellipse"></svg>
  <div class="text-small text-muted">Recent displacement pairs · ellipse: theoretical 95% region · normalized units</div>
</div>
<style>
#osc-inverse {color:var(--foreground)}
#osc-inverse .matrix {display:grid;grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px 18px; padding:12px 8px; border-left:1px solid var(--border);border-right:1px solid var(--border);margin:8px 0 16px;text-align:center}
#osc-inverse #matrices {margin-top:18px}
#osc-inverse svg {display:block;width:100%;overflow:visible}
#osc-inverse svg text {fill:var(--foreground);font-size:12px}
#osc-inverse .structure {stroke:var(--border);stroke-width:2;fill:none}
#osc-inverse .spring {stroke:var(--foreground);stroke-width:1.5;fill:none}
</style>
<script>
(() => {
const root=document.getElementById('osc-inverse'), el=id=>root.querySelector('#'+id);
const dt=.03, gamma=1;
let k1,k2,kc,a,b,d,det,theta,modes,x1=0,x2=0,n=0,mean1=0,mean2=0,m11=0,m12=0,m22=0,time=0,tick=0,points=[],running=!matchMedia('(prefers-reduced-motion: reduce)').matches, width=600;
function normal(){return Math.sqrt(-2*Math.log(Math.max(1e-15,Math.random())))*Math.cos(2*Math.PI*Math.random());}
function mode(lambda){
 const w=Math.sqrt(lambda-.25), decay=Math.exp(-dt/2), c=Math.cos(w*dt), s=Math.sin(w*dt)/w;
 const f00=decay*(c+.5*s),f01=decay*s,f10=-lambda*f01,f11=decay*(c-.5*s);
 const q00=Math.max(0,1/lambda-f00*f00/lambda-f01*f01), q01=-f00*f10/lambda-f01*f11, q11=Math.max(0,1-f10*f10/lambda-f11*f11);
 const l00=Math.sqrt(q00),l10=q01/l00,l11=Math.sqrt(Math.max(0,q11-l10*l10));
 return {lambda,f00,f01,f10,f11,l00,l10,l11,x:0,v:0};
}
function step(record=true){
 for(const m of modes){const z=normal(),z2=normal(),old=m.x;m.x=m.f00*old+m.f01*m.v+m.l00*z;m.v=m.f10*old+m.f11*m.v+m.l10*z+m.l11*z2;}
 const c=Math.cos(theta),s=Math.sin(theta);x1=c*modes[0].x-s*modes[1].x;x2=s*modes[0].x+c*modes[1].x;
 if(!record)return;
 time+=dt;tick++;
 if(tick%10===0){n++;const dx=x1-mean1,dy=x2-mean2;mean1+=dx/n;mean2+=dy/n;m11+=dx*(x1-mean1);m12+=dx*(x2-mean2);m22+=dy*(x2-mean2);points.push([x1,x2]);if(points.length>600)points.shift();}
}
function mat(id,vals){el(id).innerHTML=vals.map(v=>'<span>'+ (Number.isFinite(v)?v.toFixed(3):'—')+'</span>').join('');}
function setup(){
 k1=+el('k1').value;k2=+el('k2').value;kc=+el('kc').value;
 ['k1','k2','kc'].forEach(id=>el('o-'+id).value=(+el(id).value).toFixed(1));
 a=k1+kc;b=-kc;d=k2+kc;det=a*d-b*b;theta=.5*Math.atan2(2*b,a-d);
 const delta=Math.hypot(a-d,2*b);modes=[mode((a+d+delta)/2),mode((a+d-delta)/2)];
 n=0;mean1=mean2=m11=m12=m22=time=tick=0;points=[];
 for(let i=0;i<2000;i++)step(false);
 mat('km',[a,b,b,d]);mat('im',[d/det,-b/det,-b/det,a/det]);
 el('status').textContent='New spring settings · new measurement';draw();
}
function spring(start,end,y){let str='M'+start+','+y;for(let j=1;j<=18;j++)str+=' L'+(start+(end-start)*j/19)+','+(y+(j%2?5:-5));return str+' L'+end+','+y;}
function node(parent,tag,attrs={},text){const child=document.createElementNS('http://www.w3.org/2000/svg',tag);for(const [key,value] of Object.entries(attrs))child.setAttribute(key,value);if(text!==undefined)child.textContent=text;parent.appendChild(child);return child;}
function subscripted(parent,attrs,base,sub,rest){const text=node(parent,'text',attrs,base);node(text,'tspan',{dy:'.3em','font-size':'.75em'},sub);if(rest)node(text,'tspan',{dy:'-.3em'},rest);return text;}
function drawMechanics(){
 const svg=el('mechanics');svg.setAttribute('viewBox','0 0 '+width+' 130');svg.replaceChildren();
 const p1=width*.33+18*Math.tanh(x1),p2=width*.67+18*Math.tanh(x2), y=67;
 node(svg,'path',{class:'structure',d:'M18,40 V95 M'+(width-18)+',40 V95'});
 [[18,p1-15,'1'],[p1+15,p2-15,'c'],[p2+15,width-18,'2']].forEach(([s,e,label],i)=>{node(svg,'path',{class:'spring',d:spring(s,e,y),opacity:i===1&&kc===0?.15:1});subscripted(svg,{x:(s+e)/2,y:36,'text-anchor':'middle'},'k',label);});
 [p1,p2].forEach((p,i)=>{node(svg,'circle',{cx:p,cy:y,r:15,fill:'var(--viz-series-'+(i+1)+')'});subscripted(svg,{x:p,y:111,'text-anchor':'middle'},'x',String(i+1),' = '+[x1,x2][i].toFixed(2));});
}
function drawCloud(){
 const svg=el('cloud'),h=260,margin={l:64,r:22,t:18,b:50};svg.setAttribute('viewBox','0 0 '+width+' '+h);svg.replaceChildren();
 const c=Math.cos(theta),s=Math.sin(theta),ellipse=[];
 for(let j=0;j<=100;j++){const t=j/100*2*Math.PI,u=Math.sqrt(5.991/modes[0].lambda)*Math.cos(t),v=Math.sqrt(5.991/modes[1].lambda)*Math.sin(t);ellipse.push([c*u-s*v,s*u+c*v]);}
 const all=points.concat(ellipse),lim=all.reduce((max,p)=>Math.max(max,Math.abs(p[0]),Math.abs(p[1])),0)*1.12;
 const xs=v=>margin.l+4+(v+lim)/(2*lim)*(width-margin.r-margin.l-8),ys=v=>h-margin.b-4-(v+lim)/(2*lim)*(h-margin.b-margin.t-8);
 node(svg,'rect',{'data-chart-frame':'',x:margin.l,y:margin.t,width:width-margin.l-margin.r,height:h-margin.t-margin.b,fill:'none',stroke:'var(--border)'});
 for(const v of [-lim*.8,0,lim*.8]){node(svg,'text',{x:xs(v),y:h-margin.b+20,'text-anchor':'middle'},v.toFixed(1));node(svg,'text',{x:margin.l-8,y:ys(v)+4,'text-anchor':'end'},v.toFixed(1));}
 subscripted(svg,{class:'axis-title','data-axis':'x',x:(width+margin.l-margin.r)/2,y:h-8,'text-anchor':'middle'},'Displacement x','1');
 subscripted(svg,{class:'axis-title','data-axis':'y',transform:'translate(16,'+((h-margin.b+margin.t)/2)+') rotate(-90)','text-anchor':'middle'},'Displacement x','2');
 node(svg,'path',{d:ellipse.map((p,i)=>(i?'L':'M')+xs(p[0])+','+ys(p[1])).join(' '),fill:'none',stroke:'var(--foreground)','stroke-dasharray':'4 4'});
 const dots=node(svg,'g');for(const p of points)node(dots,'circle',{cx:xs(p[0]),cy:ys(p[1]),r:2,fill:'var(--viz-series-1)',opacity:.25});
}
function draw(){
 const cov=n>1?[m11/(n-1),m12/(n-1),m12/(n-1),m22/(n-1)]:[NaN,NaN,NaN,NaN],inv=[d/det,-b/det,-b/det,a/det];mat('cm',cov);
 const error=Math.sqrt(cov.reduce((sum,v,i)=>sum+(v-inv[i])**2,0)/inv.reduce((sum,v)=>sum+v*v,0));
 el('duration').textContent='Observation time: '+time.toFixed(1)+' · '+n.toLocaleString()+' correlated samples';el('error').textContent='Matrix error: '+(Number.isFinite(error)?(100*error).toFixed(1)+'%':'—');drawMechanics();drawCloud();
}
['k1','k2','kc'].forEach(id=>el(id).addEventListener('input',setup));
el('pause').textContent=running?'Pause':'Run';el('pause').onclick=()=>{running=!running;el('pause').textContent=running?'Pause':'Run';el('status').textContent=running?'Sampling':'Paused';};
el('collect').onclick=()=>{for(let j=0;j<30000;j++)step();draw();el('status').textContent='Collected another 900 time units';};
setup();let last=0;
if(typeof ResizeObserver==='function')new ResizeObserver(()=>{width=Math.max(280,root.clientWidth);draw();}).observe(root);
function frame(t){if(running&&t-last>32){for(let j=0;j<6;j++)step();draw();last=t;}if(root.isConnected)requestAnimationFrame(frame);}
requestAnimationFrame(frame);
})();
</script>

</main></body></html>
